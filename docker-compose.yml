services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: vedantacharya
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificates

    ports:
      - "5432:5432"

  api:
    build: .

    environment:
      DATABASE_URL: postgres://vedantacharya:postgres@postgres:5432/certificates

    ports:
      - "3000:3000"

    depends_on:
      - postgres